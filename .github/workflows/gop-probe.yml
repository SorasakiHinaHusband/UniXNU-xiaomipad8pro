# Probe: does an iPadOS kernelcache carry AppleParavirtDisplay (the IOMobileFramebuffer ABI reference)?
# Cheap: ubuntu, one download, one grep. Nothing of value changes here.
name: gop-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq unzip xz-utils p7zip-full python3-pip cmake build-essential
          git clone --depth 1 https://github.com/lzfse/lzfse.git /tmp/lzfse && cmake -S /tmp/lzfse -B /tmp/lzfse/build >/dev/null && cmake --build /tmp/lzfse/build -j4 >/dev/null && /tmp/lzfse/build/lzfse -h 2>&1 | head -3
          python3 -m pip install --quiet --break-system-packages pyimg4 || pip3 install --quiet pyimg4
          python3 -c "import pyimg4; print('pyimg4', pyimg4.__version__ if hasattr(pyimg4,'__version__') else 'ok')"

      - name: Download the iPadOS IPSW (bounded)
        run: |
          URL="https://updates.cdn-apple.com/2026FallFCS/3817acb0-03ca-45b0-9e74-e37622c5d7a6/iPad_Fall_2021_27.2.1_24B156_Restore.ipsw"
          curl -sSL --max-time 1500 -o ipsw.zip "$URL"
          ls -l ipsw.zip
          df -h / | tail -1

      - name: Extract the kernelcache
        run: |
          mkdir -p kc
          unzip -l ipsw.zip | grep -iE "\.kernelcache|kernelcache" | head -20 || true
          unzip -o -j ipsw.zip '*ernel*' -d kc || true
          ls -l kc | head
          mv kc/* kc.bin 2>/dev/null || true
          ls -l kc.bin || true
          head -c 16 kc.bin | od -An -c | head -2 || true

      - name: Decompress it (IM4P payload, lzfse)
        run: |
          set -x
          python3 - <<'PY'
          # the kernelcache is an IM4P whose data is an LZFSE block; skip both wrappers by finding the block magic
          data = open('kc.bin','rb').read()
          for m in (b'bvx2', b'bvxn', b'bvx1', b'complzss'):
              i = data.find(m)
              print(m.decode(), 'at', i)
              if i > 0:
                  open('kc.payload','wb').write(data[i:])
                  print('payload from magic:', len(data) - i, 'bytes')
                  break
          else:
              raise SystemExit('no LZFSE/LZSS magic found')
          PY
          /tmp/lzfse/build/lzfse -decode -i kc.payload -o kc.raw || echo "lzfse decode failed"
          ls -l kc.raw 2>/dev/null || true
          wc -c kc.raw 2>/dev/null || true
          head -c 32 kc.raw 2>/dev/null | od -An -c | head -3 || true
          ls -l kc.payload 2>/dev/null || true
          file kc.payload 2>/dev/null || true

      - name: Does it carry AppleParavirtDisplay / IOMobileGraphicsFamily?
        run: |
          set -uo pipefail
          echo "--- strings scan ---"
          for s in AppleParavirtDisplay IOMobileFramebufferLegacy IOMobileGraphicsFamily; do
            n=$(grep -a -c "$s" kc.raw 2>/dev/null || echo 0)
            echo "$s: $n occurrences"
          done
          echo "--- first hits (context) ---"
          grep -a -o -m5 '.\{0,40\}AppleParavirtDisplay.\{0,40\}' kc.payload 2>/dev/null | head -5 || true
          ls -l kc.payload

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gop-probe-report
          path: |
            kc.raw
          if-no-files-found: warn
          retention-days: 3

  parse:
    name: Does the k27 tree parse it (kc-vtable, gen-iomfb-abi)?
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Python and git
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3 git curl

      - name: The reference collection
        run: |
          curl -sSL --max-time 900 -o "$RUNNER_TEMP/kc.raw" "https://github.com/SorasakiHinaHusband/UniXNU-xiaomipad8pro/releases/download/abi-refs/kc.raw"
          ls -l "$RUNNER_TEMP/kc.raw"
          sha256sum "$RUNNER_TEMP/kc.raw" | cut -c1-32

      - name: The k27 tree
        run: |
          bash tooling/k27/fetch-k27-tree.sh "$RUNNER_TEMP/k27-tree" || echo "::warning::tree fetch failed"
          ls "$RUNNER_TEMP/k27-tree/scripts" | head -20 || true

      - name: kc-vtable on the reference
        run: |
          set -uo pipefail
          T="$RUNNER_TEMP/k27-tree"
          python3 "$T/scripts/kc-vtable.py" "$RUNNER_TEMP/kc.raw" AppleParavirtDisplay 2>&1 | head -40
          echo "exit=$?"

      - name: Generate the ABI header
        run: |
          set -uo pipefail
          T="$RUNNER_TEMP/k27-tree"
          python3 "$T/scripts/gen-iomfb-abi.py" "$RUNNER_TEMP/kc.raw" "$RUNNER_TEMP/IOMobileFramebufferABI.h" 2>&1 | tail -20
          echo "exit=$?"
          ls -l "$RUNNER_TEMP/IOMobileFramebufferABI.h" 2>/dev/null || echo "::warning::no header"
          head -30 "$RUNNER_TEMP/IOMobileFramebufferABI.h" 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: iomfb-abi
          path: ${{ runner.temp }}/IOMobileFramebufferABI.h
          if-no-files-found: warn
          retention-days: 7
