# The 27.3 line's RAM images from a GitHub-hosted runner: tooling/repro/fetch-and-build.sh's chain (host, inputs, systemos,
# root, kernel, fd, image), with the kernel/tree built by tooling/ci/k27-kernel.sh first (Known gap G1) and the kexts by
# tooling/ci/build-kexts.sh. What a hosted runner cannot supply is said per step and never silently skipped: the two the
# install skill calls G2 (the 27.0.1 base trust bundle) and G3 (a Data seed) are private to the owner, so the root step is
# allowed to fail (continue-on-error) and the image step is attempted only if the root image exists.
#
# Artifacts: out/ram (the RAM images and their build record), out/fd (the UEFI FD and its hash), out/inputs/k273/root/root.json
# and the logs. Nothing of Apple's but the IPSW's members' hashes is uploaded: no IPSW member, no Apple payload, no seed.
name: image

on:
  workflow_dispatch:
    inputs:
      steps:
        description: fetch-and-build.sh steps to run (default the whole chain)
        type: string
        default: host inputs systemos root kernel fd image

permissions:
  contents: read

env:
  JOBS: '6'
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'
  KDK_URL: ${{ vars.PIANO_KDK_URL }}
  SUDO: sudo
  REMOVE_AEA: '1'

jobs:
  image:
    name: RAM images
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7

      - name: Disk space before
        run: df -h / /System/Volumes/Data | sed -n '1,4p'

      - name: "Free disk space (simulator runtimes only: Xcode, its SDKs and the toolchains stay)"
        run: |
          set -u
          before=$(df -k /System/Volumes/Data | awk 'NR == 2 {print $4}')
          # Simulators: the runtime images (many GB each), the device sets and caches. The iPhoneOS/macOS SDKs under
          # Xcode.app/Contents/Developer/Platforms/*/Developer/SDKs and every Xcode install are NOT touched.
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes \
            /Library/Developer/CoreSimulator/Volumes /Library/Developer/CoreSimulator/Caches /Library/Developer/CoreSimulator/Devices \
            /Users/runner/Library/Developer/CoreSimulator/Devices /Users/runner/Library/Developer/CoreSimulator/Caches \
            # Xcode's own platform runtime profiles stay: removing them wedges xcodebuild on this image (the fakeroot
            # stage's libdispatch build stopped responding for 29 minutes in run 3), and the space they hold is small
            # next to /Library/Developer/CoreSimulator.
            /Users/runner/Library/Android /usr/local/share/dotnet /opt/hostedtoolcache /Users/runner/hostedtoolcache 2>/dev/null || true
          # keep every Xcode and its SDKs; report what is left
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          ls "$(xcrun --sdk iphoneos --show-sdk-path)" > /dev/null 2>&1 && echo "iphoneos SDK ok" || echo "::error::iphoneos SDK missing"
          after=$(df -k /System/Volumes/Data | awk 'NR == 2 {print $4}')
          echo "free before: $((before / 1048576)) GiB, after: $((after / 1048576)) GiB"
          df -h / /System/Volumes/Data | sed -n '1,4p'
      - name: Host tools
        run: |
          brew install gnu-sed mtools dtc zstd nasm mtoc acpica 2>&1 | tail -2
          brew install blacktop/tap/ipsw 2>&1 | tail -2 || true
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"
          command -v ipsw aea dtc mtools || true

      - name: Owner inputs (private release assets, when configured)
        env:
          INPUTS_REPO: ${{ vars.PIANO_INPUTS_REPO }}
          TOKEN: ${{ secrets.PIANO_INPUTS_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/owner-inputs"
          if [ -z "${INPUTS_REPO:-}" ] || [ -z "${TOKEN:-}" ]; then
            echo "::warning::no owner inputs: vars.PIANO_INPUTS_REPO / secrets.PIANO_INPUTS_TOKEN are not set (root and NativeGopDisplay stay unbuildable)"
            exit 0
          fi
          curl -fsSL -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/$INPUTS_REPO/releases/latest" \
            | python3 -c 'import json,sys; [print(a["name"], a["id"]) for a in json.load(sys.stdin).get("assets", [])]' > "$RUNNER_TEMP/assets.txt"
          cat "$RUNNER_TEMP/assets.txt"
          fetch() { # NAME DEST
            local id; id=$(awk -v n="$1" '$1 == n {print $2}' "$RUNNER_TEMP/assets.txt")
            [ -n "$id" ] || { echo "::warning::owner input $1 is not in the latest release of $INPUTS_REPO"; return 1; }
            curl -fsSL -H "Authorization: Bearer $TOKEN" -H "Accept: application/octet-stream" \
              -o "$2" "https://api.github.com/repos/$INPUTS_REPO/releases/assets/$id" && ls -l "$2"
          }
          fetch kernel.macho.trustcache "$RUNNER_TEMP/owner-inputs/kernel.macho.trustcache" || true
          fetch scratch-data.img "$RUNNER_TEMP/owner-inputs/scratch-data.img" || true
          fetch inc-hid.tar.gz "$RUNNER_TEMP/owner-inputs/inc-hid.tar.gz" || true
          fetch inc-net-piano.tar.gz "$RUNNER_TEMP/owner-inputs/inc-net-piano.tar.gz" || true
          fetch kc27.bin "$RUNNER_TEMP/owner-inputs/kc27.bin" || true
          mkdir -p out/inputs
          for f in kernel.macho.trustcache scratch-data.img; do
            [ -f "$RUNNER_TEMP/owner-inputs/$f" ] && cp "$RUNNER_TEMP/owner-inputs/$f" "out/inputs/$f" && echo "placed out/inputs/$f"
          done
      - name: k27 tree, xnu source and ld-classic
        env:
          WORK: ${{ runner.temp }}/ci
          OUT: ${{ runner.temp }}/ci/out
        run: |
          set -eo pipefail
          mkdir -p "$WORK" "$OUT"
          date -u; df -h /
          bash tooling/ci/k27-kernel.sh tree xnu ld
          date -u

      - name: Place the owner inputs in the tree (generated headers, reference collection)
        env:
          WORK: ${{ runner.temp }}/ci
        run: |
          set -uo pipefail
          T="$WORK/k27-tree/out/x12377"
          mkdir -p "$T" "$WORK/k27-tree/out/kc"
          for tarball in inc-hid inc-net-piano; do
            f="$RUNNER_TEMP/owner-inputs/$tarball.tar.gz"
            [ -f "$f" ] && { tar -xzf "$f" -C "$T" && echo "placed $T/$tarball"; } || true
          done
          f="$RUNNER_TEMP/owner-inputs/kc27.bin"
          [ -f "$f" ] && { cp "$f" "$WORK/k27-tree/out/kc/kc27.bin" && echo "placed the paravirt reference collection"; } || true
      - name: KDK headers (download bounded, expanded, removed again)
        env:
          WORK: ${{ runner.temp }}/ci
          OUT: ${{ runner.temp }}/ci/out
        run: |
          set -eo pipefail
          [ -n "$KDK_URL" ] || { echo "::error::vars.PIANO_KDK_URL is not set"; exit 1; }
          echo "downloading $KDK_URL"; date -u
          curl -fL --retry 3 --max-time 1800 --connect-timeout 30 --progress-bar -o "$RUNNER_TEMP/kdk.dmg" "$KDK_URL"
          ls -l "$RUNNER_TEMP/kdk.dmg"; df -h /; date -u
          KDK_DMG="$RUNNER_TEMP/kdk.dmg" bash tooling/ci/k27-kernel.sh kdk
          rm -f "$RUNNER_TEMP/kdk.dmg"; df -h /; date -u

      - name: Fakeroot, platform libraries and the kernel
        env:
          WORK: ${{ runner.temp }}/ci
          OUT: ${{ runner.temp }}/ci/out
        run: |
          set -eo pipefail
          sudo xcodebuild -license accept 2>/dev/null || true
          sudo xcodebuild -runFirstLaunch 2>/dev/null || true
          xcodebuild -version; xcrun --sdk iphoneos --show-sdk-path
          date -u
          # bash -x into a log: if this stage ever stalls again, the last line names the command that stalled
          bash -x tooling/ci/k27-kernel.sh fakeroot > "$RUNNER_TEMP/fakeroot.log" 2>&1 \
            || { echo "::error::fakeroot failed"; tail -60 "$RUNNER_TEMP/fakeroot.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/fakeroot.log"
          date -u
          bash tooling/ci/k27-kernel.sh platform kernel
          date -u; df -h /
      - name: Kexts (per-kext; the status file names what a hosted runner cannot build)
        env:
          WORK: ${{ runner.temp }}/ci
          OUT: ${{ runner.temp }}/ci/out
        continue-on-error: true
        run: bash tooling/ci/build-kexts.sh

      - name: The Ubuntu v1.1.0 maintenance image (the boot DT's source; pinned)
        run: |
          set -eo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/boot.zip" \
            https://github.com/yzddmr6/xiaomipad-8pro-mainline/releases/download/v1.1.0/piano-ubuntu-v1.1.0-boot.zip
          mkdir -p "$RUNNER_TEMP/maint" && unzip -o -q "$RUNNER_TEMP/boot.zip" -d "$RUNNER_TEMP/maint"
          find "$RUNNER_TEMP/maint" -name 'boot-ram-maintenance.img' -print -exec ls -l {} \;
          echo "MAINT_IMG=$(find "$RUNNER_TEMP/maint" -name 'boot-ram-maintenance.img' | head -1)" >> "$GITHUB_ENV"

      - name: Inputs (the IPSW's members from Apple's CDN, the boot DT)
        env:
          PIANO_V110: ${{ runner.temp }}/maint
        run: bash tooling/repro/fetch-and-build.sh inputs
        timeout-minutes: 120

      - name: SystemOS (sudo; the SystemOS and App cryptexes, the boot shims)
        env:
          PIANO_K27_TREE: ${{ runner.temp }}/ci/k27-tree
        run: |
          df -h /
          bash tooling/repro/fetch-and-build.sh systemos
        timeout-minutes: 90

      - name: Trust bundle from the IPSW trust caches, no own modules (G2 second option)
        run: |
          set -uo pipefail
          M=out/inputs/k273/26C5035r
          mkdir -p out/inputs
          if [ -f "$M/141-22233-021.dmg.aea.trustcache" ]; then
            python3 tooling/k273/make-trust.py "out/inputs/base-absent.bundle" \
              "$M/141-22233-021.dmg.aea.trustcache" "$M/141-22145-021.dmg.aea.trustcache" "$M/141-22106-021.dmg.trustcache" \
              out/inputs/kernel.macho.trustcache
          else
            echo "::warning::no IPSW trust caches, the trust bundle cannot be made"
          fi

      - name: Data seed from the IPSW Data template (the G3 fresh recipe, on macOS)
        env:
          UNIXNU_RESEARCH: ${{ runner.temp }}/unixnu-research
        run: |
          set -uo pipefail
          if [ -f out/inputs/scratch-data.img ]; then echo "seed present"; exit 0; fi
          python3 scripts/fetch-pins.py --only DarwinBoot || { echo "::warning::no DarwinBoot checkout"; exit 0; }
          PACKED_RAMDISK="$UNIXNU_RESEARCH/DarwinBoot/Test/packed_ramdisk.py" bash tooling/ci/make-data-seed-macos.sh \
            out/inputs/k273/26C5035r/141-22233-021.dmg out/inputs 1024 \
            || echo "::warning::the fresh Data seed recipe failed (G3 is unverified upstream too), the root step will stop at its seed gate"
      - name: Root image (needs the owner's G2 trust bundle and G3 Data seed)
        continue-on-error: true
        env:
          PIANO_K27_TREE: ${{ runner.temp }}/ci/k27-tree
        run: bash tooling/repro/fetch-and-build.sh root
        timeout-minutes: 90

      - name: Kernel relinked at the 27.3 collection's addresses
        env:
          PIANO_K27_TREE: ${{ runner.temp }}/ci/k27-tree
        run: bash tooling/repro/fetch-and-build.sh kernel

      - name: FD (UEFI)
        env:
          UNIXNU_RESEARCH: ${{ runner.temp }}/unixnu-research
        run: |
          python3 scripts/fetch-pins.py --only UniXNU,UniXNU-sm8750-common,Mu-Silicium,Device-Binaries,piano-uefi,uefi-sheng,DarwinBoot,ArmCpu,ArmDTPlatform,GopFramebuffer,RamBlock,XnuPrelink,AppleKeyStoreState
          bash tooling/firmware/build-fd.sh

      - name: KC, ADT and (when the root image exists) the RAM images
        continue-on-error: true
        env:
          PIANO_K27_TREE: ${{ runner.temp }}/ci/k27-tree
        run: |
          set -uo pipefail
          df -h /
          bash tooling/k273/build-k273-image.sh || echo "::warning::build-k273-image.sh did not finish: the KC and ADT it wrote before the root/seed gates are kept and uploaded"
          ls -la out/k27 out/adt out/ram 2>/dev/null || true
      - name: Logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          find out -name '*.log' -size -8M -exec cp --parents {} "$RUNNER_TEMP/logs/" \; 2>/dev/null || \
            find out -name '*.log' -size -8M | while read -r f; do mkdir -p "$RUNNER_TEMP/logs/$(dirname "$f")"; cp "$f" "$RUNNER_TEMP/logs/$f"; done
          cp "${{ runner.temp }}/ci/kexts-status.txt" "$RUNNER_TEMP/logs/" 2>/dev/null || true
          df -h / > "$RUNNER_TEMP/logs/df.txt"
          ls -la out out/ram out/fd 2>/dev/null >> "$RUNNER_TEMP/logs/df.txt" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: piano-image
          path: |
            ${{ runner.temp }}/logs
            out/ram
            out/fd
            out/k27/kc-k27-native.bin
            out/k27/kc-k27-native.bin.link-log
            out/adt
            out/inputs/k273/root/root.json
          if-no-files-found: warn
          retention-days: 14
